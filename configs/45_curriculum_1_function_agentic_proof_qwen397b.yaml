experiment:
  name: curriculum_01_function_agentic_proof_academiccloud_qwen397b_live
  seed: 11
  output_root: outputs/runs
dataset:
  mode: file
  path: data/raw/sec_vul_eval-train.arrow
  sample_selection: smallest_vuln_fixed_pairs_by_project
  sample_limit: null
  project_limit: null
  require_project_url: true
  pair_require_same_function: true
  pair_require_same_file: true
  validation_aware_pair_selection: true
  validated_pair_limit: 1
  candidate_pair_limit: 20
  candidate_pair_oversample_factor: 20
  require_validated_pair_both_sides: true
  validation_candidate_order: cached_smallest_first
  use_cached_pair_candidates: true
  pair_candidate_cache_path: cache/repo_inventory/pair_candidates_smallest_first.jsonl
  validation_candidate_exclude_projects: []
  validation_candidate_exclude_project_patterns: []
  validation_candidate_max_project_dataset_samples: null
  validation_candidate_max_unique_files: null
  validation_candidate_max_pair_function_chars: null
  validation_candidate_one_pair_per_project: false
  validation_candidate_clone_mirrors: false
  validation_candidate_stream_until_valid_pairs: true
  validation_candidate_use_repo_inventory: true
  validation_candidate_require_repo_inventory_usable: true
  validation_candidate_repo_inventory_sort_metric: auto
repo:
  enabled: true
  cache_dir: cache/repos/bare_mirrors
  worktree_dir: cache/worktrees
  partial_clone: false
  filter_spec: blob:none
  replace_partial_mirror_with_full_clone: false
  fetch_if_exists: false
  use_existing_mirror: true
  clone_if_missing: false
  skip_if_clone_fails: true
  prune_stale_worktrees: true
  force_recreate_registered_worktree: true
validation_cache:
  enabled: true
  cache_dir: cache/repo_inventory
  filename: commit_validation_cache.jsonl
  reuse_negative_results: true
  retry_invalid_after_days: null
snapshot:
  use_dataset_commit_id: true
  validate_target_function: true
  commit_resolution: secvuleval_patch
  body_match_threshold: 0.98
  on_validation_failure: fail
  save_validation_artifacts: true
kg:
  scope: project_snapshot
  version: codekg_explorer_integrated_v1
  backend: auto
  cache_dir: cache/kg
  build_if_missing: true
  force_rebuild: false
  max_files: 500
  max_file_bytes: 600000
  include_headers: true
  joern_parse_bin: joern-parse
  joern_export_bin: joern-export
  joern_bin: joern
  joern_work_dir: cache/joern
  joern_timeout_seconds: 1800
  joern_fallback_to_lightweight: true
  semantic_enrichment_enabled: true
  semantic_enrichment_mode: heuristic
  storage_export_graphml: true
  storage_export_csv: true
  storage_export_query_examples: true
  visualization_enabled: true
  visualization_max_nodes: 2500
  visualization_max_edges: 6000
  use_codekg: true
  kg_out_dir: codekg
  joern_home: null
  require_joern: false
  joern_language: C
  open_dashboard: false
retrieval:
  strategy: target_neighborhood
  top_k_statements: 40
  top_k_risk: 8
  top_k_safety: 8
  top_k_callees: 6
  top_k_callers: 3
  max_context_chars: 32000
  include_cwe_hint: false
  include_cve_hint: false
  retrieval_max_nodes: 520
  retrieval_joern_limit: 160
  retrieval_depth: 3
  call_depth: 2
  data_depth: 4
  control_depth: 3
  include_headers: true
  include_globals: true
  include_joern: true
agent:
  enabled: true
  mode: agentic_proof
  max_rounds: 3
  risk_hypothesis_limit: 12
  allow_kg_followup_queries: true
  max_tool_queries_per_round: 6
  max_tool_results_per_query: 8
  max_evidence_items_after_tools: 240
  save_demo_reports: true
  reasoning_trace: tool_trace
  response_format: json
  fail_open_on_parse_error: true
  max_json_repairs: 2
  enable_posthoc_commit_audit: false
  posthoc_audit_max_context_chars: 18000
  parse_failed_decision_status: parse_failed
  prompt_profile: api_rich
  api_source_chars: 24000
  api_followup_context_chars: 26000
  api_final_context_chars: 32000
  live_partial_demo_reports: true
  demo_report_autorefresh_seconds: 2.0
  hide_initial_deterministic_retrieval_in_demo: true
  demo_show_only_kg_tool_evidence: true
model:
  backend: openai_compatible
  api_base: https://chat-ai.academiccloud.de/v1
  api_key_env: ACADEMICCLOUD_API_KEY
  model_name: qwen3.5-397b-a17b
  temperature: 0.0
  top_p: 1.0
  max_tokens: 4096
  timeout_seconds: 180
  request_json_object: false
  estimate_tokens_if_missing: true
  cost:
    input_per_1k_usd: 0.003
    output_per_1k_usd: 0.015
  model_fallbacks:
  - qwen3.5-397b-a17b
  - openai-gpt-oss-120b
  - devstral-2-123b-instruct-2512
  - llama-3.3-70b-instruct
  - meta-llama-3.1-8b-instruct
  - deepseek-r1-distill-llama-70b
  api_preflight: false
  api_force_no_think: false
  api_extra_body:
    chat_template_kwargs:
      enable_thinking: false
  api_disable_thinking: true
api_quota:
  enabled: true
  requests_per_minute: 9
  requests_per_hour: 190
  requests_per_day: 390
  requests_per_month: 2900
  max_concurrent_requests: 1
  retry_max_attempts: 8
  retry_timeout_max_attempts: 1
  retry_initial_delay_seconds: 10
  retry_empty_response_max_attempts: 1
  retry_max_delay_seconds: 600
  provider_headers_enabled: true
  provider_header_probe: 'off'
  provider_header_update_from_responses: true
execution:
  classification_max_workers: 1
  api_classification_max_workers: 1
  local_classification_max_workers: 1
  parallelize_api_samples: false
  graceful_shutdown_timeout_seconds: 5
live_dashboard:
  enabled: true
  serve: true
  host: 127.0.0.1
  port: 8765
  open_browser: false
  keep_alive_after_run: true
  update_on_stage_change: true
  stream_agent_events: true
  expose_partial_report_when_running: true
  hide_initial_deterministic_retrieval_evidence: true
  show_accumulated_tokens_and_cost: true
prompting:
  include_orchestration_metadata_in_model_prompt: false
  include_cwe_hints_in_model_prompt: false
  include_cve_hints_in_model_prompt: false
scaling_analysis:
  enabled: true
  projection_sample_counts:
  - 1
  - 2
  - 4
  - 10
  - 50
  - 100
  projection_project_counts:
  - 1
  - 2
  - 5
  - 50
  - 100
  - 900
evaluation:
  binary: true
  statement_level: true
  reasoning_diagnostics: true
  make_visualizations: true
  save_tables: true
logging:
  level: INFO
  rich: true
  log_every_n_samples: 1
  profile_memory: true
  profile_time: true
  show_eta: true
agentic_proof:
  enabled: true
  answer_tag: answer
  max_hypotheses: 12
  max_queries_per_hypothesis: 6
  evidence_limit_per_query: 8
  require_counter_evidence: true
  require_minimum_proof_for_vulnerable: true
  consistency_repair_can_upgrade: false
  separate_local_risk_from_confirmed_vulnerability: true
  confidence_policy: evidence_completeness
  pair_aware_dev_mode: false
  max_tokens_source_only_hypothesis: 2048
  max_tokens_kg_query_planning: 1536
  max_tokens_hypothesis_verification: 3072
  max_tokens_counter_evidence_review: 2048
  max_tokens_final_decision: 8192
  max_tokens_schema_repair: 2048
