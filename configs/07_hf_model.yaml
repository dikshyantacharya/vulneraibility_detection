experiment:
  name: hf_qwen_coder_one_function
  seed: 11
  output_root: outputs/runs
dataset:
  mode: file
  path: data/raw/sec_vul_eval-train.arrow
  sample_limit: 1
  project_include: []
  shuffle: false
  require_project_url: true
repo:
  enabled: true
  cache_dir: cache/repos/bare_mirrors
  worktree_dir: cache/worktrees
  skip_if_clone_fails: true
snapshot:
  use_dataset_commit_id: true
  validate_target_function: true
  commit_resolution: secvuleval_patch
  parent_depth: 1
  require_filepath_exists: true
  require_function_found: false
  body_match_threshold: 0.82
  on_validation_failure: warn_and_continue
kg:
  scope: project_snapshot
  version: project_v4_agentic_bundle_budgeted_cpg_overlay
  cache_dir: cache/kg
  build_if_missing: true
  force_rebuild: false
  include_file_types:
  - .c
  - .cc
  - .cpp
  - .cxx
  - .h
  - .hpp
  - .hh
  max_files: 3000
  max_file_bytes: 600000
  max_functions: null
  save_graphml: false
  progress_log_every_files: 10
  progress_log_every_seconds: 5.0
  graph_save_log_every: 5000
  log_file_start: true
  slow_file_log_seconds: 2.0
  include_headers: true
retrieval:
  strategy: target_neighborhood
  top_k_statements: 80
  top_k_risk: 12
  top_k_safety: 10
  top_k_callees: 8
  top_k_callers: 5
  max_context_chars: 8000
  include_cwe_hint: true
  include_cve_hint: false
agent:
  enabled: true
  mode: iterative
  max_rounds: 3
  risk_hypothesis_limit: 5
  allow_kg_followup_queries: true
  reasoning_trace: evidence_summary
  response_format: json
  fail_open_on_parse_error: true
  max_json_repairs: 1
  max_evidence_items_after_tools: 40
  max_tool_results_per_query: 4
model:
  backend: hf
  repo_id: Qwen/Qwen2.5-Coder-0.5B-Instruct
  auto_download: true
  model_name: Qwen/Qwen2.5-Coder-0.5B-Instruct
  temperature: 0.0
  top_p: 1.0
  max_tokens: 700
  estimate_tokens_if_missing: true
  cost:
    input_per_1k_usd: 0.0
    output_per_1k_usd: 0.0
    currency: USD
evaluation:
  binary: true
  statement_level: true
  reasoning_diagnostics: true
  statement_match_threshold: 0.84
  make_visualizations: true
  save_tables: true
logging:
  level: INFO
  rich: true
  log_every_n_samples: 1
  profile_memory: true
  profile_time: true
  show_eta: true
